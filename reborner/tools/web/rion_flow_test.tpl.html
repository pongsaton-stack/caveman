<title>Rion Flow ทดลอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f1ec;--card:#fffdf8;--ink:#2a1a14;--mute:#6d625a;--line:#ded6cb;--acc:#2a70be;--bad:#b4371f;--ok:#2e7d4f;--stage:#9aa7a0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916;--card:#25221e;--ink:#efe7dc;--mute:#a99d90;--line:#3b3631;--acc:#6aa5e6;--bad:#e2775f;--ok:#6fc28f;--stage:#3d4642;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1916;--card:#25221e;--ink:#efe7dc;--mute:#a99d90;--line:#3b3631;--acc:#6aa5e6;--bad:#e2775f;--ok:#6fc28f;--stage:#3d4642;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;padding:20px 16px 48px}
main{max-width:1100px;margin:0 auto;display:grid;gap:18px}
h1{font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:2px 0 0;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.card h2{font-size:16px;margin:0;display:flex;justify-content:space-between;gap:8px}
.card h2 span{font-weight:400;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
canvas{width:100%;aspect-ratio:260/230;max-width:100%;border-radius:6px;display:block;image-rendering:auto}
.note{font-size:13px;margin:0;color:var(--mute)}
.note b{color:var(--bad);font-weight:600}.note i{color:var(--ok);font-style:normal;font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details img{width:100%;max-width:560px;display:block;margin-top:8px}
</style>
<main>
  <header>
    <h1>Rion · ชีต Google Flow ทดลอง</h1>
    <p class="sub">ตัดจากชีตที่ kwan ส่ง 15 ต.ค. (JPG 8×11 ช่อง) ทีละช่อง ลบพื้นเขียว ไม่ย่อ ไม่แก้ภาพ · จังหวะต่อเฟรมเป็นค่าดูในหน้านี้เท่านั้น · ร่าง ยังไม่เข้าเกม</p>
  </header>
  <div class="bar">
    <button id="play" aria-pressed="true">เล่น</button>
    <button data-spd="0.5">×0.5</button><button data-spd="1" aria-pressed="true">×1</button>
    <button id="m70" aria-pressed="true">70 เฟรม × 45 ms</button>
    <button id="skip1" aria-pressed="false">ท่าวน: ข้ามเฟรม 1</button>
    <button id="flip" aria-pressed="false">พลิกท่าในศึกให้หันซ้าย</button>
    <button data-bg="stage" aria-pressed="true">พื้นเทา</button><button data-bg="green">พื้นเขียวเดิม</button><button data-bg="dark">พื้นมืด</button>
  </div>
  <div class="grid" id="grid"></div>
  <details><summary>ชีตต้นทาง</summary><img id="sheet" alt="ชีตต้นทางจาก Google Flow"></details>
</main>
<script>
const D = __DATA__;
// ผลตรวจทีละท่า (ดูภาพ + วัดความต่างระหว่างเฟรม · ดูรายงานในแชท 15 ต.ค.)
const NOTE = {
  idle_battle: '<b>หันหน้า 3/4 ไม่ใช่ข้างซ้าย</b> · เฟรม 1 ต่างจากเฟรมอื่น 36% → กระตุกตอนวน',
  walk_front: '<i>ทิศถูก</i> · ขาขยับน้อย (เปลี่ยน 7–19%/เฟรม) · เฟรม 1 ต่าง 43% → กระตุกตอนวน',
  walk_back: '<i>ทิศถูก ไม่มีหน้า</i> · เฟรม 1 ต่าง 31% → กระตุกตอนวน',
  walk_left: '<i>หันซ้ายครบ 8 เฟรม</i> · เฟรม 1 ต่าง 38% → กระตุกตอนวน',
  walk_right: '<i>หันขวาครบ 8 เฟรม</i> · นาฬิกาอยู่แขนใกล้ (ควรอยู่แขนไกล) · เฟรม 1 ต่าง 42%',
  attack_knife: '<i>มีดทำครัวแล้ว</i> · <b>ฟันไปทางขวา</b> (สั่งหันซ้าย)',
  hurt: '<b>หันขวา/3-4</b> (สั่งหันซ้าย) · มีดาวกระแทก หน้าเจ็บ',
  kneel: '<i>จบคุกเข่าข้างเดียว มือแตะพื้น</i> · <b>หันขวา</b>',
  death: '<i>จบนอนคว่ำ หัวไปทางซ้าย</i> · <b>ช่วงล้มหันขวา แต่นอนหัวไปซ้าย</b> (ทิศขัดกันในคลิป · ปุ่มพลิกไม่พลิกท่านี้)',
  cast: '<i>มีพนมมือ + ตัวครบทุกช่อง</i> · <b>คลื่นพุ่งไปทางขวา</b>',
  run: '<b>วิ่งไปทางขวา</b> · มีจังหวะลอยไม่ชัด',
};
const BATTLE = new Set(['idle_battle', 'attack_knife', 'hurt', 'kneel', 'cast', 'run']);   // ล้มนอนไม่พลิก: เฟรมท้ายหัวไปซ้ายถูกแล้ว
let playing = true, speed = 1, flip = false, bg = 'stage', skip1 = false;   // skip1: เฟรม 1 ของท่าวนเป็นท่าคนละแบบ (ต่างจากเฟรมถัดไป 31–43%)
// ── 70 เฟรม × 45 ms (แบบคลิป SL01 ในหน้า animation test) ── เฟรมจากชีต = คีย์ · ค้างนานไม่เท่ากัน · โค้ดเติมการเคลื่อนไหว (ค่าภาพในหน้านี้ ไม่ใช่ค่าเกม)
// ภาพในชีตท่าในศึกหันขวา → "ข้างหน้า" = +x ของภาพ (ปุ่มพลิกกลับทั้งเวที) · ท่าวนไม่ใช้เฟรม 1 (ท่าคนละแบบ ต่าง 31–43%)
const N70 = 70, SEC70 = 45;
const eo = k => 1 - (1 - k) * (1 - k), ei = k => k * k, cl = k => Math.max(0, Math.min(1, k));
function seq(list, f) { let a = 0; for (const [i, n] of list) { if (f < a + n) return { i, k: (f - a) / n, at: a }; a += n; } const [i] = list[list.length - 1]; return { i, k: 1, at: a }; }
function shakeAt(f, f0, amp, len) { const d = f - f0; return d >= 0 && d < len ? amp * (1 - d / len) : 0; }
const T70 = {
  idle_battle: f => { const b = .5 - .5 * Math.cos(2 * Math.PI * f / 24); return { i: [1, 2, 3, 2][Math.floor(f / 6) % 4], sy: 1 - .016 * b, sx: 1 + .006 * b }; },
  walk: f => { const s = Math.abs(Math.sin(2 * Math.PI * f / 14)); return { i: 1 + Math.floor(f / 2) % 7, dy: -3 * s, sy: 1 - .02 * (1 - s), sx: 1 + .008 * (1 - s) }; },
  run: f => { const s = Math.abs(Math.sin(2 * Math.PI * f / 12)); return { i: Math.floor(f / 2) % 6, dy: -7 * s, sy: 1 - .03 * (1 - s), sx: 1 + .012 * (1 - s) }; },
  attack_knife: f => { const q = seq([[0, 6], [1, 12], [2, 3], [3, 2], [4, 8], [5, 8], [6, 8], [7, 23]], f);
    const dx = f < 18 ? -3 * eo(cl((f - 6) / 12)) : f < 23 ? -3 + 33 * ei(cl((f - 18) / 5)) : f < 47 ? 30 : 30 * (1 - eo(cl((f - 47) / 10)));
    const hs = f >= 23 && f < 26;   // หยุดภาพตอนกระทบ 3 เฟรม
    return { i: hs ? 4 : q.i, dx, shake: shakeAt(f, 23, 6, 8) + (f >= 6 && f < 18 ? .8 : 0), flash: f === 23 ? .45 : f === 24 ? .2 : 0, sy: f >= 6 && f < 18 ? .97 : 1 }; },
  hurt: f => { const q = seq([[0, 4], [1, 6], [2, 10], [3, 10], [4, 10], [5, 30]], f);
    return { i: q.i, dx: f < 12 ? -24 * eo(cl(f / 12)) : f < 40 ? -24 : -24 * (1 - eo(cl((f - 40) / 14))), shake: shakeAt(f, 0, 7, 10), flash: f < 2 ? .5 - f * .2 : 0 }; },
  kneel: f => { const q = seq([[0, 8], [1, 8], [2, 6], [3, 6], [4, 8], [5, 34]], f);
    return { i: q.i, shake: shakeAt(f, 22, 4, 6) + (f < 16 ? .9 : 0), sy: f >= 22 && f < 25 ? .96 : 1 }; },
  death: f => { const q = seq([[0, 6], [1, 6], [2, 5], [3, 5], [4, 6], [5, 6], [6, 4], [7, 32]], f);
    return { i: q.i, shake: shakeAt(f, 17, 5, 6) + shakeAt(f, 28, 4, 6), dy: f >= 34 && f < 38 ? -3 * Math.sin(Math.PI * (f - 34) / 4) : 0 }; },
  cast: f => { const q = seq([[0, 16], [1, 10], [2, 10], [3, 6], [4, 8], [5, 8], [6, 6], [7, 6]], f);
    const charge = f < 36 ? cl(f / 36) : 0;
    return { i: q.i, shake: charge * 1.4 + shakeAt(f, 36, 6, 8), dx: f >= 36 && f < 50 ? -6 * Math.sin(Math.PI * (f - 36) / 14) : 0, flash: f === 36 ? .35 : 0, sy: 1 - .03 * charge }; },
};
for (const k of ['walk_front', 'walk_back', 'walk_left', 'walk_right']) T70[k] = T70.walk;
let m70 = true;
const BG = { stage: () => getComputedStyle(document.documentElement).getPropertyValue('--stage'), green: () => '#03fb04', dark: () => '#141210' };
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
const cards = [];
(async () => {
  document.getElementById('sheet').src = D.sheet;
  const grid = document.getElementById('grid');
  for (const row of D.rows) {
    const frames = await Promise.all(row.frames.map(load));
    const el = document.createElement('section'); el.className = 'card';
    el.innerHTML = `<h2>${row.label}<span>${frames.length} เฟรม · ${row.ms} ms · สั่ง: ${row.want}</span></h2><canvas width="260" height="230"></canvas><p class="note">${NOTE[row.id] || ''}</p>`;
    grid.append(el); cards.push({ row, frames, cv: el.querySelector('canvas'), t: 0 });
  }
  let last = performance.now();
  const tick = now => {
    const dt = Math.max(0, Math.min(60, now - last)); last = now;   // เฟรมแรกของ rAF อาจเร็วกว่า performance.now() → ห้ามติดลบ
    for (const c of cards) {
      if (playing) c.t += dt * speed;
      const x = c.cv.getContext('2d'); x.fillStyle = BG[bg](); x.fillRect(0, 0, 260, 230);
      let im, label, o = {};
      if (m70) {
        const f = ((Math.floor(c.t / SEC70) % N70) + N70) % N70; o = T70[c.row.id](f); im = c.frames[o.i]; label = (f + 1) + '/70';
      } else {
        const fs = skip1 && c.row.loop ? c.frames.slice(1) : c.frames, n = fs.length, dur = c.row.ms * n, hold = c.row.loop ? 0 : 700;
        const tt = c.t % (dur + hold), i = Math.min(n - 1, Math.floor(tt / c.row.ms));
        im = fs[i]; label = (i + 1 + (fs === c.frames ? 0 : 1)) + '/' + c.frames.length;
      }
      const sh = o.shake || 0, f0 = Math.floor(c.t / SEC70);
      x.save();
      if (flip && BATTLE.has(c.row.id)) { x.translate(260, 0); x.scale(-1, 1); }
      x.translate(130 + (o.dx || 0) + (sh ? Math.sin(f0 * 2.3) * sh : 0), 228 + (o.dy || 0) + (sh ? Math.cos(f0 * 3.1) * sh * .6 : 0));
      x.scale(o.sx || 1, o.sy || 1); x.drawImage(im, -im.width / 2, -im.height); x.restore();
      if (o.flash) { x.fillStyle = 'rgba(255,255,255,' + o.flash + ')'; x.fillRect(0, 0, 260, 230); }
      x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(4, 4, 46, 18); x.fillStyle = '#fff'; x.font = '12px system-ui'; x.fillText(label, 9, 17);
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
document.getElementById('play').onclick = e => { playing = !playing; e.target.setAttribute('aria-pressed', playing); e.target.textContent = playing ? 'เล่น' : 'หยุด'; };
document.querySelectorAll('[data-spd]').forEach(b => b.onclick = () => { speed = +b.dataset.spd; document.querySelectorAll('[data-spd]').forEach(o => o.setAttribute('aria-pressed', o === b)); });
document.getElementById('m70').onclick = e => { m70 = !m70; e.target.setAttribute('aria-pressed', m70); for (const c of cards) c.t = 0; };
document.getElementById('skip1').onclick = e => { skip1 = !skip1; e.target.setAttribute('aria-pressed', skip1); };
document.getElementById('flip').onclick = e => { flip = !flip; e.target.setAttribute('aria-pressed', flip); };
document.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { bg = b.dataset.bg; document.querySelectorAll('[data-bg]').forEach(o => o.setAttribute('aria-pressed', o === b)); });
</script>
