name: Deploy AI Works Portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - portfolio-site/**
      - .github/workflows/deploy-portfolio-site.yml
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio-site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
